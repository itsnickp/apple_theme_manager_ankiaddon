<div class="apple-shell">
  <header class="apple-meta">
    <span class="apple-deck">{{Deck}}</span>
  </header>

  <main class="apple-content">
    <div class="apple-kicker">Question</div>
    <section class="apple-question">
      {{Front}}
    </section>

    <hr>

    {{#Back - Basic}}
    <div class="apple-kicker">Answer</div>
    <section class="apple-answer">
      {{Back - Basic}}
    </section>
    {{/Back - Basic}}

    {{#Back - Code}}
    <section class="apple-panel apple-code-panel">
      <div class="apple-kicker">Code</div>
      {{Back - Code}}
    </section>
    {{/Back - Code}}
  </main>
  {{#Tags}}
  <footer class="apple-tags">{{Tags}}</footer>
  {{/Tags}}
</div>
<script>
(function () {
  var groups = document.querySelectorAll(".apple-tags, .tags");
  for (var i = 0; i < groups.length; i++) {
    var raw = groups[i].textContent.replace(/^\s+|\s+$/g, "");
    if (!raw) {
      groups[i].style.display = "none";
      continue;
    }

    var parts = raw.split(/\s+/);
    groups[i].innerHTML = "";

    for (var j = 0; j < parts.length; j++) {
      var pill = document.createElement("span");
      pill.className = "tag";
      pill.textContent = parts[j].replace(/_/g, " ").replace(/::/g, " › ");
      groups[i].appendChild(pill);
    }
  }
})();
</script>
